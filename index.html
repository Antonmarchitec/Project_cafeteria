<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/main.css">
  <!------  GOOGLE FONTS--------->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  
  <!--SWIPER JS CDN-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <!--<link href="dist/hamburgers.css" rel="stylesheet">-->
  <link href="./css/hamburgers.css" rel="stylesheet">


  <title>Document</title>
</head>
<body>

  <div class="cont_grilla">

    <div class="grilla_header">
      <header class="cont_header">
        <figure class="block_logo">
          <img src="./source/logo.png" alt="logo" style="width: 100%;height: 100%;">
        </figure>

        <div class="block_navigation">
          <div class="block_navigation_sup">
            <!-------------------->
            <nav class="menu_secundario">
              <ul class="menu_secundario_ul">
                <li class="menu_secundario_ul_li"><a href="#" class="link"> Noticias </a></li>
                <li class="menu_secundario_ul_li"><a href="#" class="link"> Resetas </a></li>
                <li class="menu_secundario_ul_li"><a href="#" class="link"> Bebidas </a></li>
              </ul>
            </nav>

            <!---------------------->
            <div class="redes">
              <a href="#"><i class="iconRedes fa-brands fa-square-facebook"></i></a>
              <a href="#"><i class="iconRedes fa-brands fa-pinterest"></i></a>
              <a href="#"><i class="iconRedes fa-brands fa-square-instagram"></i></a>
              <a href="#"><i class="iconRedes fa-brands fa-linkedin"></i></a>

            </div>
          </div>

          <nav class="block_navigation_inf">
            <ul class="block_navigation_inf_ul">
              <li class="block_navigation_inf_ul_li"><a href="#" class="link"> About us </a></li>
              <li class="block_navigation_inf_ul_li"><a href="#" class="link"> Productos </a></li>
              <li class="block_navigation_inf_ul_li"><a href="#" class="link"> Our quinoa </a></li>
              <li class="block_navigation_inf_ul_li"><a href="#" class="link"> Stockits </a></li>
            </ul>
          </nav>
        </div>

        <div class="block_btnResponsive" id="btnResponsive">
         <button class="hamburger hamburger--spring" type="button">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
         </button>
        </div>


      </header>
    </div>

    <div class="grilla_slader">
      <div class="cont_slader">
        <div class="container_swiper" >
          <!-- Slider main container -->
          <div class="swiper">
            <!-- Additional required wrapper -->
            <div class="swiper-wrapper">
              <!-- Slides -->
              <div class="swiper-slide"> 
                <figure class="slade_imageFondo">
                  <img src="./source/Ice_cream.png" alt="Ice_cream" style="width: 100%; height: 100%;">
                </figure>

                <div class="slade_cubierta">

                </div>

                <div class="slade_text">
                  <h1 class="slade_text_h1"> Ice Cream </h1>
                  <h2 class="slade_text_h2"> Ice Cream Break </h2>
                </div>
              </div>

              <div class="swiper-slide"> 
                <figure class="slade_imageFondo">
                  <img src="./source/Ice_cream2.png" alt="Ice_cream" style="width: 100%; height: 100%;">
                </figure>

                <div class="slade_cubierta">

                </div>

                <div class="slade_text">
                  <h1 class="slade_text_h1"> Ice Cream </h1>
                  <h2 class="slade_text_h2"> Ice Cream Coofee </h2>
                </div>
              </div>
              
              <div class="swiper-slide"> 
                <figure class="slade_imageFondo">
                  <img src="./source/Ice_cream3.png" alt="Ice_cream" style="width: 100%; height: 100%;">

                </figure>

                <div class="slade_cubierta">

                </div>

                <div class="slade_text">
                  <h1 class="slade_text_h1"> Ice Cream </h1>
                  <h2 class="slade_text_h2"> Ice Cream Pastel </h2>
                </div>
              </div>
              
            </div>
            <!-- If we need pagination -->
          

            <!-- If we need scrollbar -->
            <div class="swiper-scrollbar"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grilla_section">
      <div class="cont">
        
      </div>

    </div>

  </div>
     
    

   
  
</body>


    <script src="https://kit.fontawesome.com/b7fb745aab.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


    <script src="./js/swiper.js"></script>
    <script src="./js/menu.js"></script>

</html>
