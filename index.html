<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/main.css">
  
  <!--SWIPER JS CDN-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <title>Document</title>
</head>
<body>

  <div class="cont_grilla">

    <div class="grilla_header">
      <header class="cont">
        <figure class="block_logo">
          <img src="./source/logo.png" alt="logo" style="width: 100%;height: 100%;">
        </figure>
      </header>
    </div>

    <div class="grilla_slader">
      <div class="cont"></div>

    </div>

    <div class="grilla_section">
      <div class="cont"></div>

    </div>

  </div>
     
    

    <div class="container_swiper" >
       <!-- Slider main container -->
      <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide"> 
            <figure class="cont_imagen">
              <img src="./source/img1.jpg" alt="img" style="width: 100%; height: 100%;">
            </figure>
          </div>
          <div class="swiper-slide"> 
            <figure class="cont_imagen">
              <img src="./source/img2.jpg" alt="img" style="width: 100%; height: 100%;" >
            </figure>
          </div>
          <div class="swiper-slide"> 
            <figure class="cont_imagen">
              <img src="./source/img3.jpg" alt="img" style="width: 100%; height: 100%;" >
            </figure>
          </div>
          
        </div>
        <!-- If we need pagination -->
      

        <!-- If we need scrollbar -->
        <div class="swiper-scrollbar"></div>
      </div>

    </div>
  
</body>



    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./js/swiper.js"></script>

</html>
